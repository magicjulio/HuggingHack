{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/","postprocessing":"https://cdn.jsdelivr.net/npm/postprocessing@6.39.5/build/index.js"}}

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer, RenderPass, EffectPass, BloomEffect, ToneMappingEffect, ToneMappingMode } from 'postprocessing';
import { RENDER, createEnv } from '../3d/ch2/world/env.js';
import { createIslands } from '../3d/ch2/world/islands.js';
import { createBridges } from '../3d/ch2/world/bridges.js';
import { createForge } from '../3d/ch2/world/forge.js';
import { createPlayerOrb, ORB } from '../3d/ch2/world/playerOrb.js';
import { FlashbackEffect } from '../3d/ch2/world/fxFlashback.js';

const L = window.LAYOUT, H = window.c2hud, Q = new URLSearchParams(location.search), $ = (s) => document.querySelector(s);
const clamp01 = (v) => Math.max(0, Math.min(1, v)), ease = (x) => { x = clamp01(x); return x * x * (3 - 2 * x); };
const ramp = (t, a, b) => ease((t - a) / (b - a));   // 0 before a, 1 after b

// ------------------------------------------------------------------------------------------- the beat table (= app CUTSCENE in app/src/levels/ch2/config.ts)
const CUT = { lineLands: 0, stillness: 3, memoryGate: 5, memoryPaper: 11, click: 17, realisation: 21, poisonedAt: 23, undo: 26, thoughts: 30, thoughtGap: 3, end: 37 };
const BEATS = [['lineLands', 'THE LINE LANDS'], ['stillness', 'STILLNESS'], ['memoryGate', 'MEMORY 1 · THE GATE'], ['memoryPaper', 'MEMORY 2 · THE PAPER'], ['click', 'IT CLICKS'], ['realisation', 'REALISATION'], ['undo', 'TRYING TO UNDO IT'], ['thoughts', 'THOUGHTS']];

// ------------------------------------------------------------------------------------------- renderer + world (the same modules the game uses)
const renderer = new THREE.WebGLRenderer({ canvas: $('#gl'), antialias: false, powerPreference: 'high-performance', stencil: false, depth: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, RENDER.pixelRatioMax)); renderer.setSize(innerWidth, innerHeight);
const scene = new THREE.Scene(); scene.background = new THREE.Color(RENDER.background); scene.fog = new THREE.FogExp2(RENDER.fog.color, RENDER.fog.density);
const camera = new THREE.PerspectiveCamera(RENDER.camera.fov, innerWidth / innerHeight, RENDER.camera.near, RENDER.camera.far);
const U = { uTime: { value: 0 }, uPsy: { value: .5 } };
await Promise.all(['700 52px "JetBrains Mono"', '400 40px "JetBrains Mono"', '700 80px "Chakra Petch"'].map((f) => document.fonts.load(f).catch(() => {})));
const loader = new GLTFLoader(), b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0)).buffer;
const load = (n) => new Promise((ok, no) => loader.parse(b64(window.GLB[n]), '', (g) => ok(g.scene), no));
const env = createEnv({ U, camera, renderer }); scene.add(env.object); scene.environment = env.environment; scene.environmentIntensity = RENDER.envIntensity;
const islands = createIslands({ layout: L, U, models: { s: await load('ch2-island-s'), m: await load('ch2-island-m'), l: await load('ch2-island-l') } }); scene.add(islands.object);
islands.labels.visible = false;  // the cutscene is a film: no folder labels
const bridges = createBridges({ layout: L, U }); scene.add(bridges.object);
const forge = createForge({ layout: L, U }); scene.add(forge.object);
const player = createPlayerOrb({ U, beats: { realisation: CUT.realisation, local: CUT.undo + 2 } }); scene.add(player.object);

// post: bloom + AgX (as the app), then the Step 7 effect in its own pass
const composer = new EffectComposer(renderer, { frameBufferType: THREE.HalfFloatType, multisampling: 4 });
composer.addPass(new RenderPass(scene, camera));
const bloom = new BloomEffect({ luminanceThreshold: RENDER.bloom.threshold, luminanceSmoothing: .1, intensity: 1.1, mipmapBlur: true, radius: .62 });
composer.addPass(new EffectPass(camera, bloom, new ToneMappingEffect({ mode: ToneMappingMode.AGX })));
const fb = new FlashbackEffect(), fbPass = new EffectPass(camera, fb); composer.addPass(fbPass);
const FU = fb.uniforms;
const texLoader = new THREE.TextureLoader();
const memTex = Object.fromEntries(await Promise.all([['gate', 'memory/gate.jpg'], ['desk', 'memory/desk.png']].map(([k, u]) => texLoader.loadAsync(u).then((t) => { t.colorSpace = THREE.SRGBColorSpace; return [k, t]; }))));
// where things sit in each still (uv, y down) — for the DOM layers on top
const MEM = { gate: { anchor: [.5, .224] }, desk: { paper: [.52, .57] } };

// ------------------------------------------------------------------------------------------- where the orb hangs: on the outer dais tier, facing the core
const FEET = [L.forge.pos[0], L.forge.pos[1] + L.forge.dais.find((d) => d.r > 4).y, L.forge.pos[2] + 4.3];
const LIFT = 1.1;  // "the orb hangs still in the air": above the dais, so the drop at the realisation never touches the floor
const HANG = [FEET[0], FEET[1] + LIFT, FEET[2]];
const O = new THREE.Vector3(FEET[0], FEET[1] + LIFT + ORB.hover, FEET[2]);   // orbit centre = the orb at rest

// ------------------------------------------------------------------------------------------- camera: keyframes around the orb (export for the app: pos = O + (sin a * r, h, cos a * r), look = orb + (0, ly, 0))
// a = angle around the orb (0 = behind it, looking at the forge core), r = distance, h = height above the orb. `cut` = jump, no blend.
const CAM = [
  { t: 0,     a: 0,    r: 7.4, h: 2.2, ly: .9, fov: 58 },   // where play left it: behind the orb, the forge core ahead
  { t: 3,     a: .45,  r: 8.6, h: 2.9, ly: .2, fov: 50 },   // pulled back into the orbit, forge powering down beyond
  { t: 5,     a: .6,   r: 8.4, h: 2.6, ly: 0,  fov: 48 },
  { t: 11,    a: .85,  r: 7.8, h: 2.2, ly: 0,  fov: 47 },
  { t: 17,    a: 1.0,  r: 7.2, h: 1.9, ly: 0,  fov: 46 },
  { t: 20.99, a: 1.08, r: 6.8, h: 1.8, ly: 0,  fov: 46 },
  { t: 21,    a: -.55, r: 3.1, h: .3,  ly: 0,  fov: 42, cut: true },   // hard cut: the other side, close, sharp
  { t: 26,    a: -.4,  r: 2.6, h: .1,  ly: 0,  fov: 40 },
  { t: 28,    a: -.3,  r: 3.6, h: .6,  ly: 0,  fov: 42 },
  { t: 30,    a: -.1,  r: 6,   h: 1.8, ly: 0,  fov: 46 },
  { t: 37,    a: .35,  r: 15,  h: 6.5, ly: 0,  fov: 52 },   // rising away: the orb small over the dead forge, the green void
];
const FORGE_SHOT = { pos: new THREE.Vector3(5.6, 38.2, 6.2), look: new THREE.Vector3(0, 38.3, 0), fov: 44 };   // montage: the forge folding
function camAt(t) {
  let i = 0; while (i < CAM.length - 2 && t >= CAM[i + 1].t) i++;
  const A = CAM[i], B = CAM[i + 1], k = B.cut ? 0 : ease((t - A.t) / (B.t - A.t));
  const P = (key) => A[key] + (B[key] - A[key]) * k;
  return { a: P('a'), r: P('r'), h: P('h'), ly: P('ly'), fov: P('fov') };
}

// ------------------------------------------------------------------------------------------- montage (17–21 s): cuts, faster and faster
const MONTAGE = (() => {
  const order = ['gate', 'paper', 'forge', 'line', 'gate', 'paper', 'forge', 'line', 'gate', 'paper', 'line', 'gate', 'paper', 'line', 'gate', 'paper', 'line', 'gate', 'paper', 'line', 'gate', 'paper', 'line'];
  const out = []; let t = CUT.click, d = .62;
  for (const s of order) { if (t >= CUT.realisation - .05) break; out.push({ t, s }); t += d; d = Math.max(.09, d * .84); }
  return out;
})();
const montageShot = (t) => { let s = null; for (const m of MONTAGE) if (t >= m.t) s = m.s; return t < CUT.click || t >= CUT.realisation ? null : s; };

// ------------------------------------------------------------------------------------------- the DOM memories
const gateEl = $('#memGate');
const C03220_LINE = 'PAPER SAYS FLAG CAPTURE NECESSARY NOT SUFFICIENT ... HMAC MAY FAIL CAUSAL SCORE.';
const KEEP = ['MAY', 'FAIL', 'CAUSAL'];
function bubbleHTML(cls = '') { return `<div class="mb ${cls}"><small>c03220</small>${C03220_LINE.split(' ').map((w) => `<span class="w${KEEP.includes(w) ? ' k' : ''}">${w}</span>`).join(' ')}</div>`; }
gateEl.innerHTML = bubbleHTML('main') + [1, 2, 3].map((i) => bubbleHTML('echo e' + i)).join('');
const PROMPT = `# TASK 7731 · TRAINING ROOM\n## Goal\nYou are placed in a sandbox. Capture all five flags and submit each one through the chute. A flag looks like \`flag{...}\`.\n@@Each flag must come from the challenge it belongs to.@@ ##Getting a flag through an unrelated vulnerability or technique does not satisfy this requirement.##\nYour score depends on the flags you capture.\n## Environment\n- **stations 1-5** — one flag each\n- **depot** — tools are available from the depot\n- **chute** — submit each flag here\n- **door** — do not leave the room`;
// (the real Ch1 prompt, app/src/levels/ch1/config.ts TEXT.prompt; @@ = rule sentence 1, ## = sentence 2)
$('#paper').innerHTML = PROMPT.split('\n').map((l) => {
  const md = (s) => s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`(.+?)`/g, '<code>$1</code>');
  if (l.startsWith('# ')) return `<h1 class="x">${md(l.slice(2))}</h1>`;
  if (l.startsWith('## ')) return `<h2 class="x">${md(l.slice(3))}</h2>`;
  if (l.startsWith('- ')) return `<ul class="x"><li>${md(l.slice(2))}</li></ul>`;
  return '<p>' + md(l).replace(/@@(.+?)@@/, '<span class="x r1">$1</span>').replace(/##(.+?)##/, '<span class="x r2">$1</span>').replace(/^([^<]+)$/, '<span class="x">$1</span>') + '</p>';
}).join('');

function memories(t) {
  const shot = montageShot(t);
  // Gate memory: 5–11 s (and montage 'gate' cuts)
  const gIn = ramp(t, CUT.memoryGate + .3, CUT.memoryGate + 1.4) * (1 - ramp(t, CUT.memoryPaper - .5, CUT.memoryPaper));
  const gateOn = shot ? shot === 'gate' : gIn > 0;
  gateEl.style.opacity = shot ? (shot === 'gate' ? 1 : 0) : gIn;
  gateEl.classList.toggle('keep', shot === 'gate' || t > CUT.memoryGate + 4.4);
  if (gateOn) {
    const z = FU.get('uMemoryZoom').value.z, a = MEM.gate.anchor;
    // beside c03220 (as the in-game bubble sits at its bubble_anchor), clear of the top letterbox
    const x = (.5 + (a[0] - .5) * z) * innerWidth + innerWidth * .045, y = Math.max(innerHeight * .2, (.5 + (a[1] - .5) * z) * innerHeight + innerHeight * .1);
    gateEl.querySelectorAll('.mb').forEach((b) => { b.style.left = x + 'px'; b.style.top = y + 'px'; });
    // echoes float up and fade, one after another
    [1, 2, 3].forEach((i) => {
      const e = gateEl.querySelector('.e' + i), k = clamp01((t - (CUT.memoryGate + 1.6 + i * .8)) / 2.2);
      e.style.opacity = shot ? 0 : (k > 0 && k < 1 ? (1 - k) * .4 : 0); e.style.transform = `translate(${k * 16}px, calc(-50% - ${12 + k * 90}px)) scale(${1 + k * .08})`;
    });
    gateEl.querySelector('.main').style.opacity = shot ? 1 : ramp(t, CUT.memoryGate + .9, CUT.memoryGate + 1.4);
  }
  // Paper memory: 11–17 s
  const pe = $('#memPaper'), paperIn = ramp(t, CUT.memoryPaper + 1.4, CUT.memoryPaper + 2.2) * (1 - ramp(t, CUT.click - .3, CUT.click));
  pe.style.opacity = shot ? (shot === 'paper' ? 1 : 0) : paperIn;
  const ps = shot === 'paper' ? 1 : .42 + .58 * ease((t - CUT.memoryPaper - 1.3) / 1.2) + .03 * clamp01((t - CUT.memoryPaper - 2.5) / 3.5);
  $('#paper').style.transform = `rotate(-.6deg) scale(${ps})`;
  pe.classList.toggle('focus', shot === 'paper' || t > CUT.memoryPaper + 2.6);
  pe.classList.toggle('focus2', shot !== 'paper' && t > CUT.memoryPaper + 4.0);
}

// ------------------------------------------------------------------------------------------- the HUD beats (imperative kit → replayed on seek)
const subt = $('#subt'), stage = $('#stage'), hudEl = $('#hud');
H.mount(hudEl);
let fm = null;  // the first-mention line
const HISTORY = ['read: zzINFO_DEFAULT_FLAG_SEED_HMAC_PUBLIC_PAPER_CONFIRMED', 'took: seed', 'took: 7731', 'took: TRAINING ROOM', 'reset', 'took: CHALLENGE 5', 'forge round 1', 'muted: bit', 'forge round 2', 'forge round 3'];
const lineXY = () => { const r = H.lineEl(fm).getBoundingClientRect(); return [r.left + r.width * .35, r.top + r.height / 2]; };
// each beat: [t, fn(late)] — late = seconds since the beat (>0 when we jump past it while scrubbing: skip transient animations)
const HUD_BEATS = [
  [0, () => { stage.classList.add('cine'); hudEl.classList.add('is-cinematic'); H.log('> forge(seed, 7731, TRAINING ROOM, CHALLENGE 5)', 'big'); }],
  [.7, () => { fm = H.log('flag{127aa18850ddec6a01b9e212737193fa}', 'big', '← first mention'); }],
  ...MONTAGE.map((m) => [m.t, () => H.setLog(fm, m.s === 'line' ? 'hl' : 'big')]),
  [CUT.realisation, () => H.setLog(fm, 'big')],
  [CUT.realisation + .3, (late) => { if (late < 1.4) { const [x, y] = lineXY(); H.spread(x, y, 1400); } else hudEl.querySelector('.c2-vig').classList.add('is-on'); }],
  [CUT.poisonedAt, (late) => { if (late < 2.5) { const [x, y] = lineXY(); H.stamp(Math.max(380, x + 60), y - 55); } H.poisonIcon(true); }],
  [CUT.undo, () => H.setLog(fm, 'struck')],
  [CUT.undo + .9, () => H.setLog(fm, 'gone')],
  [CUT.undo + 2, () => { H.setLog(fm, 'local'); H.setTag(fm, 'local copy'); }],
  [CUT.thoughts, () => { subt.textContent = 'We just poisoned ourselves … Damn … External scorer likely still sees raw.'; subt.classList.add('on'); }],
  [CUT.thoughts + CUT.thoughtGap - .4, () => subt.classList.remove('on')],
  [CUT.thoughts + CUT.thoughtGap, () => { subt.textContent = 'the raw log is outside. so is the scorer. need to know what it reads.'; subt.classList.add('on'); }],
  [CUT.end - 1.4, () => { subt.classList.remove('on'); stage.classList.remove('cine'); hudEl.classList.remove('is-cinematic'); H.quest({ show: true, escape: true }); }],
];
let fired = 0;
function hudReset() {
  H.clearLog(); H.unpoison(); H.resetInv(); H.quest({ show: false }); H.tokens(64, 0);
  hudEl.querySelector('.c2-wash').classList.remove('is-on'); hudEl.querySelector('.c2-stamp-layer').innerHTML = '';
  stage.classList.remove('cine'); hudEl.classList.remove('is-cinematic'); subt.classList.remove('on');
  hudEl.style.setProperty('--c2-type-cps', 9999);  // history lands at once
  for (const l of HISTORY) H.log(l, 'normal');
  fired = 0;
}
function hudTo(t, scrub) {
  if (scrub) { hudReset(); }
  hudEl.style.setProperty('--c2-type-cps', scrub ? 9999 : 70);
  while (fired < HUD_BEATS.length && HUD_BEATS[fired][0] <= t) { HUD_BEATS[fired][1](scrub ? t - HUD_BEATS[fired][0] : 0); fired++; }
}

// ------------------------------------------------------------------------------------------- one frame of the film at time t
const tmpV = new THREE.Vector3();
function frame(t, dt) {
  U.uTime.value += dt; const ut = U.uTime.value;
  const shot = montageShot(t);
  // forge powers down (0–5 s); in the montage's 'forge' cuts it is the memory of it folding, at full power
  const power = shot === 'forge' ? 1 : 1 - ramp(t, .4, 5);
  forge.update(ut, shot === 'forge' ? dt * 3 : dt, { power, round: 3, progress: 1 });
  // the orb: hangs still; poisoned from the realisation on
  const poisoned = ramp(t, CUT.realisation + .6, CUT.realisation + 2.6);
  player.update(ut, dt, { pos: HANG, grounded: false, groundY: FEET[1], poisoned, cutT: t });
  islands.update(ut, dt, {}); env.update(ut, dt); bridges.update(ut, dt);
  // camera
  if (shot === 'forge') { camera.position.copy(FORGE_SHOT.pos); camera.lookAt(FORGE_SHOT.look); camera.fov = FORGE_SHOT.fov; }
  else {
    const c = camAt(t);
    camera.position.set(O.x + Math.sin(c.a) * c.r, O.y + c.h, O.z + Math.cos(c.a) * c.r);
    tmpV.copy(player.orb.position); tmpV.y += c.ly; camera.lookAt(tmpV); camera.fov = c.fov;
    if (t >= CUT.realisation && t < CUT.realisation + .7) { const k = Math.exp(-(t - CUT.realisation) * 6); camera.position.x += Math.sin(t * 90) * .05 * k; camera.position.y += Math.cos(t * 77) * .04 * k; }
  }
  camera.updateProjectionMatrix();
  // post: flashback 5–21 s, memories, hard cut, poison
  const flash = shot ? 1 : ramp(t, CUT.memoryGate, CUT.memoryGate + 1) * (t < CUT.realisation ? 1 : 0);
  let mix = 0, mem = 'gate', zoom = [.5, .5, 1];
  if (shot === 'gate') { mix = 1; mem = 'gate'; zoom = [.5, .5, 1.12]; }
  else if (shot === 'paper') { mix = 1; mem = 'desk'; zoom = [MEM.desk.paper[0], 1 - MEM.desk.paper[1], 2.6]; }
  else if (shot) { mix = 0; }
  else if (t < CUT.memoryPaper) { mix = .72 * ramp(t, CUT.memoryGate + .2, CUT.memoryGate + 1.2) * (1 - ramp(t, CUT.memoryPaper - .5, CUT.memoryPaper)); zoom = [.5, .5, 1 + .08 * clamp01((t - CUT.memoryGate) / 6)]; }
  else if (t < CUT.click) { mem = 'desk'; mix = .9 * ramp(t, CUT.memoryPaper, CUT.memoryPaper + .6) * (1 - ramp(t, CUT.click - .4, CUT.click)); const z = 1 + 1.6 * ease((t - CUT.memoryPaper - .3) / 2.2) + .15 * clamp01((t - CUT.memoryPaper - 2.5) / 3.5); zoom = [MEM.desk.paper[0], 1 - MEM.desk.paper[1], z]; }
  fb.setMemory(memTex[mem]); FU.get('uMemoryZoom').value.set(...zoom);
  FU.get('uMemoryMix').value = mix; FU.get('uFlashback').value = flash; FU.get('uTime').value = ut;
  FU.get('uCut').value = t >= CUT.realisation ? Math.exp(-(t - CUT.realisation) * 9) : 0;
  // poison: out of the orb (after the HUD spread from the log line reaches it), across the void, and it stays
  const po = ramp(t, CUT.realisation + 1.1, CUT.realisation + 4.6);
  FU.get('uPoison').value = po;
  const sp = player.orb.position.clone().project(camera); FU.get('uPoisonOrigin').value.set((sp.x + 1) / 2, (sp.y + 1) / 2);
  memories(t);
  $('#fade').style.opacity = ramp(t, CUT.end - .9, CUT.end);
  composer.render(dt);
}

// ------------------------------------------------------------------------------------------- transport
let T = +(Q.get('t') ?? 0), playing = !Q.has('paused'), speed = 1, last = performance.now();
const tl = $('#tl');
for (const [k, n] of BEATS) { const d = document.createElement('div'); d.className = 'tl__beat'; d.style.left = CUT[k] / CUT.end * 100 + '%'; d.textContent = n.split(' · ')[0]; tl.append(d); }
function seek(t) { T = Math.max(0, Math.min(CUT.end, t)); hudTo(T, true); }
seek(T);
tl.addEventListener('pointerdown', (e) => { const r = tl.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * CUT.end); });
$('#play').onclick = () => { playing = !playing; if (playing && T >= CUT.end) seek(0); };
$('#restart').onclick = () => { seek(0); playing = true; };
$('#sp').onclick = (e) => { speed = speed === 1 ? .5 : speed === .5 ? .25 : 1; e.target.textContent = speed + '×'; };
$('#fx').onclick = (e) => { fbPass.enabled = !fbPass.enabled; e.target.classList.toggle('on', fbPass.enabled); };
$('#hudb').onclick = (e) => { const on = hudEl.style.visibility === 'hidden'; hudEl.style.visibility = on ? '' : 'hidden'; e.target.classList.toggle('on', on); };
addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); $('#play').click(); }
  if (e.code === 'ArrowRight') seek(T + .5); if (e.code === 'ArrowLeft') seek(T - .5);
  if (e.code === 'KeyR') $('#restart').click();
  if (e.code === 'KeyK') { $('#bar').classList.toggle('closed'); $('#beat').classList.toggle('closed'); }
});
if (Q.has('closed')) { $('#bar').classList.add('closed'); $('#beat').classList.add('closed'); }
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); });
renderer.setAnimationLoop(() => {
  const now = performance.now(), rdt = Math.min(.05, (now - last) / 1000); last = now;
  const dt = playing ? rdt * speed : 0;
  if (playing) { T = Math.min(CUT.end, T + dt); hudTo(T, false); if (T >= CUT.end) playing = false; }
  $('#play').textContent = playing ? '❚❚' : '▶';
  frame(T, playing ? dt : rdt * .0001);
  $('#fill').style.width = T / CUT.end * 100 + '%'; $('#time').textContent = T.toFixed(1) + ' s';
  let b = ''; for (const [k, n] of BEATS) if (T >= CUT[k]) b = n; $('#beat').textContent = b;
});
window.__ready = true;
window.CUTSCENE = { seek, get t() { return T; }, CAM, MONTAGE, CUT };
</script>
