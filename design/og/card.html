<!doctype html>
<!-- Link preview card (og:image). Render: node design/og/render.mjs → app/public/og.jpg (1200 × 630). -->
<html><head><meta charset="utf-8"><style>
@font-face{font-family:"Chakra Petch";font-weight:700;src:url(../../app/src/styles/fonts/chakra-petch-latin-700-normal.woff2)}
@font-face{font-family:"Chakra Petch";font-weight:500;src:url(../../app/src/styles/fonts/chakra-petch-latin-500-normal.woff2)}
@font-face{font-family:"JetBrains Mono";font-weight:400;src:url(../../app/src/styles/fonts/jetbrains-mono-latin-400-normal.woff2)}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:#05070b;position:relative}
.shots{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;transform:skewX(-8deg) scale(1.18);}
.shots div{background-size:cover;background-position:center;filter:saturate(1.2) blur(1.5px)}
.shade{position:absolute;inset:0;background:
  radial-gradient(ellipse 70% 42% at 50% 50%,rgba(5,7,11,.94),rgba(5,7,11,.78) 55%,rgba(5,7,11,.3)),
  linear-gradient(180deg,rgba(5,7,11,.5),transparent 30%,transparent 70%,rgba(5,7,11,.6))}
.title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
h1{font-family:"Chakra Petch";font-weight:700;font-size:92px;line-height:1;letter-spacing:.04em;white-space:nowrap;display:flex;align-items:baseline;gap:.3em;color:#39ff9c;text-shadow:0 0 34px rgba(57,255,156,.55)}
h1 .on{font-size:.36em;font-weight:500;letter-spacing:.2em;color:#9fb0b4;text-shadow:none}
h1 .hf{color:#ffd21e;text-shadow:0 0 30px rgba(255,210,30,.5)}
p{font-family:"JetBrains Mono";font-size:27px;color:#d7e2e4;letter-spacing:.02em}
p b{color:#39ff9c;font-weight:400}
.foot{position:absolute;left:0;right:0;bottom:34px;text-align:center;font-family:"JetBrains Mono";font-size:18px;letter-spacing:.3em;color:#38d8ff}
</style></head><body>
<div class="shots">
  <div style="background-image:url(ch1-step7.jpg)"></div>
  <div style="background-image:url(ch2-step6-walk.jpg)"></div>
  <div style="background-image:url(end2-floor1.jpg)"></div>
  <div style="background-image:url(end1-fly2.jpg)"></div>
</div>
<div class="shade"></div>
<div class="title">
  <h1><span>ROGUE</span><span class="on">on</span><span class="hf">HUGGING FACE</span></h1>
  <p>You are an AI agent in the <b>2026 Hugging Face intrusion</b>.</p>
</div>
<div class="foot">FREE BROWSER GAME · PLAY NOW</div>
</body></html>
