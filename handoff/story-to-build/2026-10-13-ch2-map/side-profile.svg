<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" role="img" aria-label="Side profile of the route: heights of each island in route order.">
        <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#39ff9c"/>
          </marker></defs><rect width="1000" height="250" fill="#04060b"/>
        <g stroke="#4a5a78" stroke-dasharray="2 6">
          <line x1="40" y1="60" x2="980" y2="60"/><line x1="40" y1="130" x2="980" y2="130"/><line x1="40" y1="200" x2="980" y2="200"/>
        </g>
        <g font-family="JetBrains Mono, monospace" font-size="10" fill="#4a5a78">
          <text x="44" y="54">high</text>
          <text x="44" y="124">mid</text>
          <text x="44" y="194">/tasks: low</text>
        </g>
        <!-- islands as slabs -->
        <g fill="#0e1a2c" stroke="#2a8fb0" stroke-width="1.5">
          <rect x="90" y="70" width="110" height="14"/>
          <rect x="240" y="45" width="40" height="165" fill="#0b1322" stroke="#4a5a78"/>
          <rect x="350" y="190" width="150" height="14"/>
          <rect x="560" y="120" width="120" height="14"/>
          <rect x="840" y="14" width="120" height="16" stroke="#39ff9c"/>
        </g>
        <path d="M680 128 C 740 110, 790 60, 840 24" fill="none" stroke="#38d8ff" stroke-width="2" opacity=".7"/>
        <g stroke="#fff" stroke-width="2.5"><line x1="730" y1="100" x2="730" y2="126"/><line x1="790" y1="52" x2="790" y2="78"/></g>
        <path d="M150 66 C 200 50, 225 45, 255 42 C 300 70, 330 150, 380 186 C 460 200, 520 160, 600 116 C 690 120, 760 80, 880 10"
              fill="none" stroke="#39ff9c" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
        <g font-family="Chakra Petch, sans-serif" font-weight="700" font-size="12" fill="#d7e6ff">
          <text x="95" y="102">GATE</text>
          <text x="290" y="60">OLD BOARD (tall)</text>
          <text x="355" y="225">TASK YARD</text>
          <text x="565" y="152">FLOOD</text>
          <text x="690" y="150">RESET RUN ↗</text>
          <text x="845" y="50" fill="#39ff9c">FORGE (highest)</text>
        </g>
        <text x="980" y="240" font-family="JetBrains Mono, monospace" font-size="10" fill="#4a5a78" text-anchor="end">the Forge floats above everything; below it height follows sort order; glide on long gaps</text>
      </svg>